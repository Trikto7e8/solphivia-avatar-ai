name: Google Play release readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and build unsigned release bundle
        run: bash gradlew --no-daemon testReleaseUnitTest lintRelease bundleRelease
      - name: Check 64-bit native ELF page alignment
        run: python3 tools/check_native_alignment.py app/build/outputs/bundle/release/app-release.aab
      - name: Retain unsigned candidate and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-readiness-UNSIGNED-not-for-upload
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-release.*
            app/build/test-results/testReleaseUnitTest/*.xml
