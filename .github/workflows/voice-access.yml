name: Voice Access verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify command allowlist and ShareBridge parsing
        run: |
          mkdir -p /tmp/voice-tests
          javac -encoding UTF-8 -d /tmp/voice-tests app/src/main/java/it/solphivia/mobile/VoiceAccessRules.java app/src/main/java/it/solphivia/mobile/ShareBridge.java verification/VoiceAccessRulesTest.java
          java -cp /tmp/voice-tests it.solphivia.mobile.VoiceAccessRulesTest
      - name: Build isolated APK and instrumentation tests
        run: bash gradlew --no-daemon -PverificationBuild assembleDebug assembleDebugAndroidTest
      - name: Android lint
        run: bash gradlew --no-daemon -PverificationBuild lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-access-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
