name: Android alpha verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build isolated app and instrumentation tests
        run: bash gradlew --no-daemon -PverificationBuild assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/lint-results-debug.*
