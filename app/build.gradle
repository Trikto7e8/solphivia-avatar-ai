plugins { id 'com.android.application' }
android {
 namespace 'it.solphivia.mobile'
 compileSdk 35
 defaultConfig { applicationId 'it.solphivia.mobile'; minSdk 26; targetSdk 35; versionCode 38; versionName '0.9.2-alpha9' }
 if (project.hasProperty('verificationBuild')) { defaultConfig { applicationIdSuffix '.verification' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
 defaultConfig { testInstrumentationRunner project.findProperty('testRunner') ?: 'it.solphivia.mobile.RegressionInstrumentation' }
}
dependencies {
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
