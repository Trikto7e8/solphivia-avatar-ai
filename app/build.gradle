plugins { id 'com.android.application' }
android {
 namespace 'it.solphivia.mobile'
 compileSdk 35
 defaultConfig { applicationId 'it.solphivia.mobile'; minSdk 26; targetSdk 35; versionCode 31; versionName '0.9.2-alpha2' }
 if (project.hasProperty('verificationBuild')) { defaultConfig { applicationIdSuffix '.verification' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig { testInstrumentationRunner project.findProperty('testRunner') ?: 'it.solphivia.mobile.RegressionInstrumentation' }
}
