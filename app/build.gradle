plugins { id 'com.android.application' }
android {
 namespace 'it.solphivia.mobile'
 compileSdk 35
 defaultConfig { applicationId 'it.solphivia.mobile'; minSdk 26; targetSdk 35; versionCode 34; versionName '0.9.2-alpha5' }
 // Dedicated trial ID avoids signature conflicts with earlier verification APKs.
 if (project.hasProperty('verificationBuild')) { defaultConfig { applicationIdSuffix '.voicefix20261021'; versionNameSuffix '-voicefix' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig { testInstrumentationRunner project.findProperty('testRunner') ?: 'it.solphivia.mobile.RegressionInstrumentation' }
}
dependencies { implementation 'com.alphacephei:vosk-android:0.3.75' }
