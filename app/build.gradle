plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
}
android {
 namespace 'it.solphivia.mobile'
 compileSdk 35
 defaultConfig { applicationId 'it.solphivia.mobile'; minSdk 26; targetSdk 35; versionCode 52; versionName '1.1.0-beta.5-test.2'; manifestPlaceholders = [appLabel: 'Solphivia IA'] }
 if (project.hasProperty('verificationBuild')) { defaultConfig { applicationIdSuffix '.v11.verification'; manifestPlaceholders = [appLabel: 'Solphivia IA 1.1 beta 4 · PROVA'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
 defaultConfig { testInstrumentationRunner project.findProperty('testRunner') ?: 'it.solphivia.mobile.RegressionInstrumentation' }
}
kotlin { jvmToolchain(17) }
dependencies {
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
 testImplementation 'junit:junit:4.13.2'
}
